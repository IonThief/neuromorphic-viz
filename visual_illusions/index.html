<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DVS & Bio-Vision Simulator</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Neuromorphic Vision Simulator</h1>
      <div id="eps-counter">EPS: 0 (Raw View)</div>
    </header>

    <main>
      <aside class="controls panel">
        
        <div class="control-group">
          <label for="illusion-select">Select Illusion</label>
          <select id="illusion-select">
            <option value="troxler">Troxler Fading</option>
            <option value="contrast">Simultaneous Contrast</option>
            <option value="reverse-phi">Reverse Phi Motion</option>
            <option value="hermann">Hermann Grid</option>
            <option value="spiral">Rotating Spiral</option>
            <option value="stepping-feet">Stepping Feet</option>
            <option value="barberpole">Barberpole</option>
            <option value="mib">Motion Induced Blindness</option>
            <option value="flash-lag">Flash Lag Effect</option>
            <option value="lilac-chaser">Lilac Chaser</option>
          </select>
        </div>

        <div class="control-group">
          <button id="dvs-toggle">Show DVS (Event) View</button>
          <button id="bio-toggle">Toggle Lateral Inhibition</button>
        </div>

        <div class="control-group">
          <label for="threshold">DVS Event Threshold</label>
          <input type="range" id="threshold" min="1" max="50" value="15" />
        </div>

        <div class="control-group">
          <label for="speed">Global Speed</label>
          <input
            type="range"
            id="speed"
            min="0.1"
            max="5.0"
            step="0.1"
            value="2.0"
          />
        </div>

        <div class="control-group">
          <label for="canvas-scale">Canvas Scale</label>
          <input
            type="range"
            id="canvas-scale"
            min="0.5"
            max="3.0"
            step="0.1"
            value="1.0"
          />
        </div>

        <hr style="border-color: #333; margin: 10px 0" />

        
        <div id="custom-controls" class="control-group">
          
        </div>

        
        <div id="explanation-box" class="explanation">
          
        </div>
      </aside>

      <section class="canvas-container panel">
        <div id="canvas-wrapper">
          <canvas id="raw-canvas" width="500" height="500"></canvas>
          <canvas
            id="dvs-canvas"
            width="500"
            height="500"
            class="hidden"
          ></canvas>
        </div>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
